name: "03 - CD: Dev Deploy & Auto-Promote to QA"

on:
  push:
    branches:
      - dev

permissions:
  contents: write
  pull-requests: write
  deployments: write
  packages: write

jobs:
  # Step 1: Build & Package Immutable Artifact
  build-artifact:
    name: "Build Immutable Artifact (SHA)"
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compute Artifact Tag
        id: vars
        run: echo "image_tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image (Build Once)
        run: |
          echo "Building container image tagged as app:${{ steps.vars.outputs.image_tag }}..."
          docker build -t company/enterprise-app:${{ steps.vars.outputs.image_tag }} .
          # In real production: docker push ghcr.io/${{ github.repository }}:${{ steps.vars.outputs.image_tag }}

  # Step 2: Deploy to Development Environment
  deploy-dev:
    name: "Deploy to DEV Environment"
    needs: build-artifact
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.example.com
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Deployment
        run: |
          echo "🚀 Deploying immutable artifact: app:${{ needs.build-artifact.outputs.image_tag }}"
          echo "🌐 Environment: ${{ vars.APP_ENV || 'development' }}"
          echo "🔗 Connecting to Database: ${{ secrets.DATABASE_URL || 'dev-database-cluster' }}"
          # Deployment command here (e.g., kubectl, AWS ECS, Helm, Terraform, or SSH)
          echo "✅ Dev deployment successfully completed!"

  # Step 3: Automatically Create / Sync Promotion PR to QA
  auto-promote-to-qa:
    name: "Auto-Create/Update Promotion PR to QA"
    needs: [build-artifact, deploy-dev]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create or Update Promotion PR (dev ➔ qa)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Check if PR already exists from dev to qa
            const { data: existingPRs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:dev`,
              base: 'qa',
              state: 'open'
            });

            const prBody = `## 🚀 Automated Environment Promotion: \`dev\` ➔ \`qa\`
            
            This automated PR promotes the latest validated development commits to the **QA / Staging** environment.
            
            ### 📦 Build Artifact
            - **Artifact Tag:** \`${{ needs.build-artifact.outputs.image_tag }}\`
            - **Commit SHA:** \`${{ github.sha }}\`
            - **Author:** @${{ github.actor }}
            
            ### 📋 Verification Checklist for QA Leads:
            - [ ] Automated unit and integration tests passed in Dev.
            - [ ] Dev environment smoke test verified.
            - [ ] Staging database migration plan reviewed (if applicable).
            
            ---
            *Auto-generated by GitHub Actions Workflow: 03-dev-deploy-and-promote.yml*`;

            if (existingPRs.length > 0) {
              const pr = existingPRs[0];
              core.info(`Updating existing Promotion PR #${pr.number}`);
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                body: prBody
              });
            } else {
              core.info('Creating new Promotion PR: dev ➔ qa');
              try {
                const newPR = await github.rest.pulls.create({
                  owner,
                  repo,
                  title: `[Promotion] Release Candidate from dev (${new Date().toISOString().split('T')[0]})`,
                  head: 'dev',
                  base: 'qa',
                  body: prBody
                });
                core.info(`Created PR #${newPR.data.number}`);
              } catch (err) {
                core.warning(`Notice: ${err.message}. (If dev and qa are already in sync, no new PR is needed.)`);
              }
            }
