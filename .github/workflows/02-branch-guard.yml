name: "02 - Governance: Branch Protection Guard"

on:
  pull_request:
    branches:
      - qa
      - main
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: write
  contents: read
  statuses: write

jobs:
  enforce-branch-flow:
    name: "Enforce Dev ➔ QA ➔ Prod Governance"
    runs-on: ubuntu-latest

    steps:
      - name: Validate Source and Target Branches
        id: check-flow
        uses: actions/github-script@v7
        with:
          script: |
            const baseBranch = context.payload.pull_request.base.ref; // target branch
            const headBranch = context.payload.pull_request.head.ref; // source branch
            const user = context.payload.pull_request.user.login;

            core.info(`PR Target Branch (Base): ${baseBranch}`);
            core.info(`PR Source Branch (Head): ${headBranch}`);
            core.info(`PR Author: ${user}`);

            let isValid = true;
            let failureReason = "";

            if (baseBranch === 'qa' && headBranch !== 'dev') {
              isValid = false;
              failureReason = `⛔ **Governance Violation:** Direct PRs to \`qa\` from \`${headBranch}\` are prohibited.\n\n` +
                `👉 In this organization, **all changes must first merge into \`dev\`**.\n` +
                `Once merged into \`dev\`, an automated promotion PR (\`dev\` ➔ \`qa\`) will be created for the QA team to review.`;
            } else if (baseBranch === 'main' && headBranch !== 'qa') {
              isValid = false;
              failureReason = `⛔ **Governance Violation:** Direct PRs to \`main\` (Production) from \`${headBranch}\` are prohibited.\n\n` +
                `👉 In this organization, **all releases must originate from \`qa\`** after full staging validation.\n` +
                `Flow: \`feature/*\` ➔ \`dev\` ➔ \`qa\` ➔ \`main\`.`;
            }

            if (!isValid) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: failureReason
              });
              
              core.setFailed(failureReason);
            } else {
              core.info(`Branch flow governance check passed: ${headBranch} ➔ ${baseBranch}`);
            }
