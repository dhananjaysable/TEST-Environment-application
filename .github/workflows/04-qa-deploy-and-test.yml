name: "04 - CD: QA Deploy, Smoke Tests & Auto-Promote to Prod"

on:
  push:
    branches:
      - qa

permissions:
  contents: write
  pull-requests: write
  deployments: write

jobs:
  # Step 1: Deploy to QA / Staging Environment
  deploy-qa:
    name: "Deploy to QA Environment"
    runs-on: ubuntu-latest
    environment:
      name: qa
      url: https://qa.example.com
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Resolve Artifact Tag
        id: vars
        run: echo "image_tag=sha-${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Execute QA Deployment
        run: |
          echo "🚀 Deploying immutable artifact: app:${{ steps.vars.outputs.image_tag }} to QA/Staging"
          echo "🌐 Environment: ${{ vars.APP_ENV || 'qa' }}"
          echo "🔗 Connecting to QA Database: ${{ secrets.DATABASE_URL || 'qa-database-cluster' }}"
          # Deployment command here (e.g. Helm upgrade, ArgoCD sync, ECS deploy)
          echo "✅ QA deployment completed successfully!"

  # Step 2: Run Automated Staging & Smoke Test Suite
  e2e-smoke-tests:
    name: "Run QA Integration & Smoke Tests"
    needs: deploy-qa
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run E2E / API Health Checks
        run: |
          echo "🧪 Running automated health and integration checks against QA..."
          npm run test:e2e --if-present
          echo "✅ All QA automated test suites passed!"

  # Step 3: Automatically Create / Sync Release PR to Main (Production)
  auto-promote-to-prod:
    name: "Auto-Create/Update Release PR to Main"
    needs: [deploy-qa, e2e-smoke-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Create or Update Release PR (qa ➔ main)
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // Check if PR already exists from qa to main
            const { data: existingPRs } = await github.rest.pulls.list({
              owner,
              repo,
              head: `${owner}:qa`,
              base: 'main',
              state: 'open'
            });

            const prBody = `## 🌟 Production Release Candidate: \`qa\` ➔ \`main\`
            
            This pull request contains changes that have successfully passed **Dev and QA testing suites**.
            
            ### 📦 Release Details
            - **Artifact Tag:** \`sha-${{ github.sha }}\`
            - **Merged to QA by:** @${{ github.actor }}
            - **Staging Test Results:** ✅ Automated Smoke & Integration Tests Passed
            
            ### 🛡️ Production Deployment Gates:
            1. **2 Required Approvals** from Engineering Lead & Security/DevOps.
            2. Upon merge, the **Production Environment Gate** will require manual sign-off before cloud infrastructure rollout.
            
            ---
            *Auto-generated by GitHub Actions Workflow: 04-qa-deploy-and-test.yml*`;

            if (existingPRs.length > 0) {
              const pr = existingPRs[0];
              core.info(`Updating existing Release PR #${pr.number}`);
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                body: prBody
              });
            } else {
              core.info('Creating new Release PR: qa ➔ main');
              try {
                const newPR = await github.rest.pulls.create({
                  owner,
                  repo,
                  title: `[Release] Production Release Candidate (${new Date().toISOString().split('T')[0]})`,
                  head: 'qa',
                  base: 'main',
                  body: prBody
                });
                core.info(`Created PR #${newPR.data.number}`);
              } catch (err) {
                core.warning(`Notice: ${err.message}. (If qa and main are already in sync, no new PR is needed.)`);
              }
            }
